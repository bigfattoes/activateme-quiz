  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const BEAT = 0.5;
      const beats = [
        { word: "#s1-word-a", acti: "#s1-acti-a", glow: "#s1-glow-a", at: 0 },
        { word: "#s1-word-b", acti: "#s1-acti-b", glow: "#s1-glow-b", at: 2 * BEAT },
        { word: "#s1-word-c", acti: "#s1-acti-c", glow: "#s1-glow-c", at: 4 * BEAT },
      ];

      beats.forEach((b, i) => {
        const prev = beats[i - 1];
        // Hard-cut word swap on the beat: the previous word leaves instantly,
        // the new one settles from a soft blur (no overshoot).
        if (prev) tl.set(prev.word, { opacity: 0 }, b.at);
        tl.fromTo(
          b.word,
          { opacity: 0, scale: 1.06, filter: "blur(16px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.34, ease: "power3.out" },
          b.at,
        );

        // Acti swaps sport on the same beat (scale-swap, smooth settle).
        if (prev) {
          tl.to(prev.acti, { opacity: 0, scale: 0.9, duration: 0.12, ease: "power2.in" }, b.at - 0.06);
          tl.fromTo(
            b.acti,
            { opacity: 0, scale: 0.88, y: 30 },
            { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "power3.out" },
            b.at,
          );
        } else {
          tl.fromTo(
            b.acti,
            { opacity: 0, scale: 0.94, y: 140 },
            { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" },
            b.at,
          );
        }

        // The glow behind Acti walks through the brand gradient.
        if (prev) tl.to(prev.glow, { opacity: 0, duration: 0.45, ease: "power2.out" }, b.at);
        tl.fromTo(
          b.glow,
          { opacity: 0, scale: 0.85 },
          { opacity: 1, scale: 1, duration: i === 0 ? 0.7 : 0.45, ease: "power3.out" },
          b.at,
        );
      });

      window.__timelines["01-sports-a"] = tl;
    })();
  </script>
