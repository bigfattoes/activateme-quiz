  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const BEAT = 0.5;
      const SIXTEENTH = 0.125;
      const words = gsap.utils.toArray("#s2-stage .s2-word[data-k]");
      const actis = gsap.utils.toArray("#s2-stage .s2-acti");

      // Swap schedule: two full beats (handing off from frame 1's slot),
      // then a 16th-note flicker through the other seven sports.
      const times = [0, BEAT];
      for (let i = 0; i < 7; i++) times.push(2 * BEAT + i * SIXTEENTH);
      const FLICKER_END = 2 * BEAT + 7 * SIXTEENTH; // 1.875: one blank 16th
      const GRID_AT = 4 * BEAT; // 2.0

      tl.set(words.slice(1).concat(actis.slice(1)), { opacity: 0 }, 0);
      times.forEach((t, k) => {
        const flicker = k >= 2;
        if (k > 0) {
          tl.set(words[k - 1], { opacity: 0 }, t);
          tl.set(actis[k - 1], { opacity: 0 }, t);
        }
        if (flicker) {
          // Flicker: instant hard cuts, a touch of motion blur on Acti.
          tl.set(words[k], { opacity: 1 }, t);
          tl.set(actis[k], { opacity: 1, filter: "blur(10px)", x: 40 }, t);
          tl.to(actis[k], { filter: "blur(0px)", x: 0, duration: 0.1, ease: "power2.out" }, t);
        } else {
          tl.fromTo(words[k], { opacity: 0, scale: 1.06, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, t);
          tl.fromTo(actis[k], { opacity: 0, scale: 0.88, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "power3.out" }, t);
        }
      });
      tl.set(words[words.length - 1], { opacity: 0 }, FLICKER_END);
      tl.set(actis[actis.length - 1], { opacity: 0 }, FLICKER_END);

      // Glow: orange for Cycling, then the full brand gradient from Creativity on.
      tl.fromTo("#s2-glow-orange", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.out" }, BEAT);
      tl.fromTo("#s2-glow-full", { opacity: 0, scale: 0.8 }, { opacity: 0.55, scale: 1, duration: 0.5, ease: "power3.out" }, BEAT);
      tl.to("#s2-glow-full", { opacity: 0.38, scale: 1.25, duration: 0.6, ease: "power3.out" }, GRID_AT);

      // Finale: "12 activities." + all twelve Acti assemble from the centre out.
      tl.fromTo("#s2-word-12", { opacity: 0, scale: 1.06, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.34, ease: "power3.out" }, GRID_AT);
      const cells = gsap.utils.toArray("#s2-grid .s2-cell");
      cells.forEach((cell, i) => {
        const col = i % 3, row = Math.floor(i / 3);
        const dist = Math.abs(col - 1) + Math.abs(row - 1.5);
        tl.fromTo(
          cell,
          { opacity: 0, scale: 0.4, x: (1 - col) * 120, y: (1.5 - row) * 110 },
          { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" },
          GRID_AT + dist * 0.05,
        );
      });

      window.__timelines["02-sports-b"] = tl;
    })();
  </script>
