<!doctype html>
<html lang="en">
<head>


</head>
<body>

  <div class="bg" aria-hidden="true"></div>
  <main id="app" class="app" aria-live="polite">
    <!-- Start screen: shown straight away so the first paint is fast. -->
    <section class="screen screen-start" id="screen-start">
      <div class="brand">
        <img src="http://localhost:8788/assets/logo-small.webp" alt="" width="40" height="36">
        <span data-s="eventName">ActivateMe Fest</span>
      </div>
      <img class="acti acti-hero bob" src="http://localhost:8788/assets/acti/wave.webp" alt="Acti, the ActivateMe mascot">
      <p class="kicker" data-s="startKicker">ActivateMe Fest quiz</p>
      <h1 data-s="startTitle">What should my kid try?</h1>
      <p class="lead" data-s="startText">6 quick questions, under a minute. Acti will find your kid's perfect activity!</p>
      <button class="btn btn-big" id="start-btn" type="button" data-s="startButton">Let's go!</button>
      <p class="note" data-s="startNote">No sign-up needed to see the result.</p>
    </section>
  </main>

  <noscript><p class="noscript">Please turn on JavaScript to take the quiz.</p></noscript>

  <script src="/data/strings.js"></script>
  <script src="/data/quiz.js"></script>
  <script src="/data/clubs.js"></script>
  <script src="/js/card.js"></script>
  <script src="/js/app.js"></script>



</body>
</html>
